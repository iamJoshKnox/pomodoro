<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00406B">
  <meta name="description" content="A simple Cooptimize focus timer.">
  <title>Focus · Cooptimize</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="state-setup">
  <main class="app">
    <div class="masthead">
      <div class="dial-wrap" id="dial-wrap">
        <svg class="dial" id="dial" viewBox="-640 -640 1280 1280" role="timer" aria-label="Focus timer">
          <path class="ring ring-navy-track" d="M-556.31 224.76A600 600 0 0 1 424.26 -424.26"/>
          <path class="ring ring-navy" id="progress" d="M-556.31 224.76A600 600 0 0 1 424.26 -424.26"/>
          <g id="hand-forest"><path class="ring ring-forest" d="M0 507A507 507 0 1 1 358.5 -358.5"/></g>
          <g id="hand-olive"><path class="ring ring-olive" d="M292.74 292.74A414 414 0 1 1 292.74 -292.74"/></g>
          <g id="hand-lime"><path class="ring ring-lime" d="M216.02 216.02A305.5 305.5 0 1 1 216.02 -216.02"/></g>
          <g class="scale" id="scale" aria-hidden="true"></g>
          <g class="scale-labels" id="scale-labels" aria-hidden="true"></g>
          <path class="pointer" d="M645 0L725 -36V36Z" transform="rotate(315)"/><!-- fixed at the 0 mark -->
          <circle class="halo" r="113"/>
          <circle class="dot" r="113"/>
        </svg>
      </div>

      <header class="intro">
        <p class="eyebrow">Cooptimize</p>
        <h1>Focus session</h1>
        <p class="lede">Set your intent, pick a length, and go.</p>
      </header>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <form class="card fields" id="fields" autocomplete="off" onsubmit="return false">
      <div class="field field-goal" id="field-goal">
        <label for="goal">What's the big goal?</label>
        <textarea id="goal" rows="1" placeholder="Ship the Q3 sales dashboard"></textarea>
      </div>
      <div class="field field-why">
        <div class="field-head">
          <label for="why">Why?</label>
          <button type="button" class="think" data-reveal="1">(Think Hard)</button>
        </div>
        <textarea id="why" rows="1" placeholder="Leadership needs it for Monday's review"></textarea>
      </div>
      <div class="field field-why" id="why-level-1" hidden>
        <div class="field-head">
          <label for="why1">Why?</label>
          <button type="button" class="think" data-reveal="2">(Think Harder)</button>
        </div>
        <textarea id="why1" rows="1" placeholder="Why does that matter?"></textarea>
      </div>
      <div class="field field-why" id="why-level-2" hidden>
        <div class="field-head">
          <label for="why2">Why?</label>
          <button type="button" class="think" data-reveal="3">(UltraThink)</button>
        </div>
        <textarea id="why2" rows="1" placeholder="And why does that matter?"></textarea>
      </div>
      <div class="field field-why" id="why-level-3" hidden>
        <label for="why3">Why?</label>
        <textarea id="why3" rows="1" placeholder="The real reason, underneath it all"></textarea>
      </div>
      <div class="field field-why-summary">
        <label>Why?</label>
        <p class="why-summary" id="why-summary"></p>
      </div>
      <div class="field field-try">
        <label for="attempt" id="attempt-label">What I will try:</label>
        <textarea id="attempt" rows="1" placeholder="Rebuild the date table and fix the YoY measure"></textarea>
      </div>
    </form>

    <div class="durations" id="durations" role="group" aria-label="Start a focus session">
      <button type="button" class="duration duration-15" data-minutes="15"><span class="duration-n">15</span><span class="duration-u">min</span></button>
      <button type="button" class="duration duration-30" data-minutes="30"><span class="duration-n">30</span><span class="duration-u">min</span></button>
      <button type="button" class="duration duration-45" data-minutes="45"><span class="duration-n">45</span><span class="duration-u">min</span></button>
    </div>

    <button type="button" class="text-button end-early" id="end-early">End early</button>

    <div class="ask" id="ask">
      <div class="ask-buttons">
        <button type="button" class="ask-button" data-who="Joel">Ask Joel</button>
        <button type="button" class="ask-button" data-who="Eric">Ask Eric</button>
      </div>
      <p class="hint">Copies your goal, why, and what you tried, ready to paste into Teams.</p>
      <button type="button" class="text-button restart" id="restart">Start another session</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="assertive"></div>

  <script src="app.js" defer></script>
</body>
</html>
